name: Run Tests

on:
  push:
    branches: [main, lab_5, lab_6, lab_7, lab_8]
  pull_request:
    branches: [main, lab_5, lab_6, lab_7, lab_8]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонування репозиторію
        uses: actions/checkout@v4

      - name: 🟢 Встановлення Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Встановлення залежностей 1_lab
        run: |
          cd 1_lab
          npm install

      - name: 📦 Встановлення залежностей lab6-e2e
        run: |
          cd lab6-e2e
          npm install

      - name: 📦 Встановлення залежностей ui-testing
        run: |
          cd ui-testing
          npm install

      - name: 🎭 Встановлення Playwright (1_lab)
        run: |
          cd 1_lab
          npx playwright install --with-deps

      - name: 🎭 Встановлення Playwright (lab6-e2e)
        run: |
          cd lab6-e2e
          npx playwright install --with-deps

      - name: 🎭 Встановлення Playwright (ui-testing)
        run: |
          cd ui-testing
          npx playwright install --with-deps

      - name: 🧪 Запуск тестів 1_lab
        run: |
          cd 1_lab
          npx playwright test

      - name: 🧪 Запуск тестів lab6-e2e
        run: |
          cd lab6-e2e
          npx playwright test

      - name: 🧪 Запуск тестів ui-testing
        run: |
          cd ui-testing
          npx playwright test

      - name: 📊 Генерація звіту (lab6-e2e)
        run: |
          cd lab6-e2e
          npx playwright show-report
